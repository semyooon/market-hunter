[project]
name = "market-hunter"
version = "0.1.0"
description = "Private marketplace deal finder with a REST API and a Codex MCP bridge."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "mcp>=1.12,<2",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "respx>=0.22,<1",
]

[project.scripts]
market-hunter-api = "market_hunter.api:run"
market-hunter-mcp = "market_hunter.mcp_server:run"
market-hunter-worker = "market_hunter.worker:run"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_hunter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
